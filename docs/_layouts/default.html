<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh' }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>">
  <link rel="alternate" type="application/rss+xml" title="Horizon Daily RSS (ZH)" href="{{ '/feed-zh.xml' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="Horizon Daily RSS (EN)" href="{{ '/feed-en.xml' | relative_url }}">

  <!-- Fonts: serif for editorial body, mono for meta -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/magazine.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="logo">
      <span class="logo-icon">🌅</span>
      <span class="logo-text">Horizon Daily</span>
    </a>
    <nav class="header-nav">
      <a href="{{ '/' | relative_url }}">日报</a>
      <a href="{{ '/feed-zh.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</header>

<main class="main-content">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p>Powered by <a href="https://github.com/Thysrael/Horizon">Horizon</a> · AI 信息雷达 · 由 <a href="https://github.com/beyond-motion">beyond-motion</a> 部署</p>
  </div>
</footer>

<script src="{{ '/assets/js/horizon.js' | relative_url }}" defer></script>

</body>
</html>
